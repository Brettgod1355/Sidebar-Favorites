plugins {
    id 'java'
}

repositories {
    maven {
        url = 'https://repo.runelite.net'
        content { includeGroupByRegex('net\\.runelite.*') }
    }
    mavenCentral()
}

def runeLiteVersion = providers.gradleProperty('runeLiteVersion').getOrElse('latest.release')
group = 'com.sidebarfavorites'
version = '0.1.2'

dependencies {
    compileOnly "net.runelite:client:${runeLiteVersion}"
    testImplementation "net.runelite:client:${runeLiteVersion}"
    testImplementation "net.runelite:jshell:${runeLiteVersion}"
    testImplementation 'junit:junit:4.13.2'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(11)
}

test {
    systemProperty 'java.awt.headless', 'true'
    testLogging { events 'passed', 'skipped', 'failed' }
}

// The Plugin Hub packages through its own task, not this build's `jar` task, so a
// `jar {}` customisation never reaches the distributed artifact. Feeding the notices
// through processResources puts them in every jar, which BSD 2-Clause requires of
// binary redistributions.
processResources {
    from(['LICENSE', 'THIRD_PARTY_NOTICES.md']) { into 'META-INF' }
}

tasks.register('run', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.sidebarfavorites.SidebarFavoritesLauncher'
    jvmArgs '-ea'
    args '--developer-mode', '--debug'
}
